<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" fill="none">
  <!-- Top and bottom bars only -->
  <line x1="5" y1="4" x2="115" y2="4" stroke="#C0C0C0" stroke-width="3" stroke-linecap="round"/>
  <line x1="5" y1="56" x2="115" y2="56" stroke="#C0C0C0" stroke-width="3" stroke-linecap="round"/>
  <!-- Horizontal shelf bar -->
  <line x1="5" y1="30" x2="115" y2="30" stroke="#D4D4D4" stroke-width="1.5"/>
  <!-- Open compartment indication -->
  <rect x="10" y="10" width="100" height="16" fill="#FAFAFA" rx="1" opacity="0.5"/>
  <rect x="10" y="34" width="100" height="16" fill="#FAFAFA" rx="1" opacity="0.5"/>
</svg>
